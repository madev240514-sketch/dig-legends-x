<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIG LEGENDS X - Recrutamento</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(180deg,#1d1105,#2f1807,#4d2608);
color:white;
}

header{
padding:60px 20px;
text-align:center;
}

h1{
font-family:Fredoka;
font-size:55px;
color:#ff9f2f;
}

header p{
margin-top:15px;
font-size:18px;
color:#ddd;
}

.container{
max-width:900px;
margin:auto;
padding:25px;
}

.card{
background:#2b1a10;
border:2px solid #ff8c00;
border-radius:20px;
padding:25px;
margin-bottom:25px;
box-shadow:0 0 25px rgba(255,140,0,.25);
}

.card h2{
margin-bottom:20px;
color:#ffb347;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1a120d;
color:white;
font-size:15px;
}

textarea{
resize:vertical;
min-height:120px;
}

.checkbox{
display:flex;
align-items:center;
margin-top:15px;
gap:10px;
}

.checkbox input{
width:20px;
height:20px;
}

button{
width:100%;
padding:18px;
font-size:20px;
font-family:Fredoka;
border:none;
border-radius:15px;
background:#ff8c00;
color:white;
cursor:pointer;
transition:.2s;
margin-top:25px;
}

button:hover{
transform:scale(1.03);
background:#ff9d21;
}

footer{
text-align:center;
padding:30px;
color:#aaa;
}

.success{
display:none;
margin-top:20px;
padding:18px;
background:#147c3b;
border-radius:12px;
text-align:center;
font-weight:bold;
}
</style>

</head>
<body>

<header>

<h1>DIG LEGENDS X</h1>

<p>Faça parte da equipe oficial do jogo.</p>

</header>

<div class="container">

<div class="card">

<h2>Informações</h2>

<label>Usuário do Roblox</label>
<input type="text">

<label>Nick do Discord</label>
<input type="text" placeholder="usuario#0000">

<label>Idade</label>
<input type="number">

<label>Cargo desejado</label>

<select>
<option>Builder</option>
<option>Scripter</option>
<option>UI Designer</option>
<option>Modelador</option>
<option>Artista</option>
</select>

<label>Nível de experiência</label>

<select>
<option>Iniciante</option>
<option>Intermediário</option>
<option>Avançado</option>
<option>Profissional</option>
</select>

<label>Há quanto tempo desenvolve?</label>

<select>
<option>Menos de 6 meses</option>
<option>6 meses - 1 ano</option>
<option>1 - 2 anos</option>
<option>Mais de 2 anos</option>
</select>

<label>Conte sobre seus projetos</label>

<textarea></textarea>

<label>Por que quer entrar na equipe?</label>

<textarea></textarea>

<label>Quanto tempo por semana você pode dedicar?</label>

<select>
<option>Até 5 horas</option>
<option>5 a 10 horas</option>
<option>10 a 20 horas</option>
<option>Mais de 20 horas</option>
</select>

<div class="checkbox">
<input type="checkbox">
<span>Possuo uma conta no Discord.</span>
</div>

<div class="checkbox">
<input type="checkbox">
<span>Concordo em entrar no servidor caso seja aprovado.</span>
</div>

<button onclick="enviar()">Enviar Inscrição</button>

<div class="success" id="ok">
Sua inscrição foi enviada com sucesso! Boa sorte!
</div>

</div>

</div>

<footer>

© DIG LEGENDS X

</footer>

<script>
function enviar(){
document.getElementById("ok").style.display="block";
window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});
}
</script>

</body>
</html>
